<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knihovnička Chotouchov</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .book-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }
        .book-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }
        .book-info p {
            margin: 0;
            color: #64748b;
            font-size: 0.85rem;
        }
        .status {
            font-weight: bold;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 5px;
            display: inline-block;
        }
        .status.dostupna {
            background: #dcfce7;
            color: #166534;
        }
        .status.pujceno {
            background: #fee2e2;
            color: #991b1b;
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-borrow {
            background: #2563eb;
            color: white;
        }
        .btn-return {
            background: #16a34a;
            color: white;
        }
        .add-section {
            margin-top: 25px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 15px;
        }
        .add-section h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-add {
            width: 100%;
            background: #475569;
            color: white;
            padding: 10px;
        }
        #loading {
            text-align: center;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Chotouchovská knihovnička</h1>
    <p class="subtitle">Vezmi si knihu, přečti a vrať zase zpět na zastávku.</p>

    <div id="loading">Načítám knihy z cloudu...</div>
    <div id="book-list"></div>

    <div class="add-section">
        <h3>Přidat novou knihu do budky</h3>
        <input type="text" id="new-title" placeholder="Název knihy">
        <input type="text" id="new-author" placeholder="Autor">
        <button class="btn-add" onclick="addNewBook()">Přidat knihu</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tvoje Firebase konfigurace:
    const firebaseConfig = {
        apiKey: "AIzaSyCLLYcp97Fmb4_pQ83gXULPKTqeGTe7GEs",
        authDomain: "chotouchov-knihovna.firebaseapp.com",
        projectId: "chotouchov-knihovna",
        storageBucket: "chotouchov-knihovna.firebasestorage.app",
        messagingSenderId: "291041275912",
        appId: "1:291041275912:web:60896aaf9a383549b761bd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const listDiv = document.getElementById('book-list');
    const loadingDiv = document.getElementById('loading');

    onSnapshot(collection(db, "books"), (snapshot) => {
        loadingDiv.style.display = 'none';
        listDiv.innerHTML = '';

        if (snapshot.empty) {
            listDiv.innerHTML = '<p style="text-align:center;">V budce zatím nejsou žádné knihy. Přidej první!</p>';
            return;
        }

        snapshot.forEach((docSnap) => {
            const book = docSnap.data();
            const id = docSnap.id;

            const card = document.createElement('div');
            card.className = 'book-card';

            const statusClass = book.status === 'dostupna' ? 'dostupna' : 'pujceno';
            const statusText = book.status === 'dostupna' ? '🟢 Dostupná v budce' : '🔴 Právě vypůjčeno';
            const actionBtn = book.status === 'dostupna' 
                ? `<button class="btn-borrow" onclick="toggleBookStatus('${id}', 'pujceno')">Půjčit si</button>`
                : `<button class="btn-return" onclick="toggleBookStatus('${id}', 'dostupna')">Vrátit zpět</button>`;

            card.innerHTML = `
                <div class="book-info">
                    <h3>${escapeHtml(book.title)}</h3>
                    <p>Autor: ${escapeHtml(book.author)}</p>
                    <span class="status ${statusClass}">${statusText}</span>
                </div>
                <div>${actionBtn}</div>
            `;
            listDiv.appendChild(card);
        });
    });

    window.toggleBookStatus = async function(id, newStatus) {
        const bookRef = doc(db, "books", id);
        try {
            await updateDoc(bookRef, { status: newStatus });
        } catch (error) {
            alert("Chyba při aktualizaci: " + error.message);
        }
    };

    window.addNewBook = async function() {
        const titleInput = document.getElementById('new-title');
        const authorInput = document.getElementById('new-author');

        if (titleInput.value.trim() === '' || authorInput.value.trim() === '') {
            alert('Vyplň prosím název i autora knihy!');
            return;
        }

        try {
            await addDoc(collection(db, "books"), {
                title: titleInput.value.trim(),
                author: authorInput.value.trim(),
                status: 'dostupna'
            });
            titleInput.value = '';
            authorInput.value = '';
        } catch (error) {
            alert("Chyba při přidávání knihy: " + error.message);
        }
    };

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
